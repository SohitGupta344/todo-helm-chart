common:
  containerRegistryURL: sohitacrdev02.azurecr.io
  ingressClass: azure-application-gateway

  serviceAccount:
    create: true
    name: todoapp-sa

  keyVault:
    enabled: true
    secretProviderClass: todoapp-keyvault


ui:
  replicas: 2
  image:
    name: todo-ui
    tag: v3
  port: 80
  ServicePort: 80
  ingress:
    host: ui.sohitguptadevops.online
    ingressClass: azure-application-gateway


getTask:
  replicas: 2
  image:
    name: todo-get-task-api
    tag: v2
  port: 8000
  ServicePort: 80
  ingress:
    host: get-tasks-api.sohitguptadevops.online
    ingressClass: azure-application-gateway


deleteTask:
  replicas: 2
  image:
    name: todo-delete-tasks-api
    tag: v2
  port: 8000
  ServicePort: 80
  ingress:
    host: delete-task-api.sohitguptadevops.online
    ingressClass: azure-application-gateway


addTask:
  replicas: 2
  image:
    name: todo-add-tasks-api
    tag: v2
  port: 8000
  ServicePort: 80
  ingress:
    host: add-task-api.sohitguptadevops.online
    ingressClass: azure-application-gateway